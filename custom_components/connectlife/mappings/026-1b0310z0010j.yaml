# Hisense BD/BC-310WP2BWF1 freezer.
# ConnectLife returns no energy statistics for this model (#667).
statistics:
  source: energy_consumption_curve
  daily_energy_kwh: false
properties:
  # Range reported by refrigerator_min_temperature / refrigerator_max_temperature
  - property: refrigerator_temperature
    number:
      min_value: 2
      max_value: 8
  # Read-only physical freezer/refrigerator mode feedback verified in device logs.
  # Do not expose a writable switch until the API command is confirmed.
  - property: refrigerator_freeze_swith_state
    entity_category: diagnostic
    binary_sensor:
      options:
        0: false
        1: true
